name: "Build"

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.jar.outputs.version }}
  push:
    branches: [ "**" ]
    paths-ignore: [ "**/*.md" ]
  pull_request:
    paths-ignore: [ "**/*.md" ]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_is_release: ${{ inputs.release || false }}

jobs:

  natives:
    name: "Natives (${{ matrix.platform }})"
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The manylinux images keep the glibc requirement low (2.28)
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    container: ${{ matrix.container }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The checkout is owned by the runner user but the container steps run as root,
      # so git refuses to read the repository until the directory is marked as safe
      - name: "Trust Repository"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Cache Natives"
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/generated/natives/
          key: natives-${{ matrix.platform }}-${{ matrix.container || matrix.runner }}-${{ hashFiles('*.gradle.kts', 'build-logic/**', 'CMakeLists.txt', 'cmake/**', 'src/main/cpp/**', 'src/main/java/com/xpdustry/nohorny/natives/NoHornyNativeLookup.java') }}

      - name: "Setup Java 25"
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: "Build Natives"
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: ./gradlew cmakeBuild

      - name: "Upload Natives"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: natives-${{ matrix.platform }}
          path: build/generated/natives/
          if-no-files-found: error

  jar:
    name: "Jar"
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # Other builds only warn, commits predating the version bump of a release still have to build
      - name: "Get And Validate Version"
        id: version
        env:
          IS_RELEASE: ${{ inputs.release }}
        run: |
          version="$(java .github/scripts/Version.java get)"
          if [ -n "$(git tag -l "v$version")" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::'v$version' is already released"
              exit 1
            fi
            echo "::warning::'v$version' is already released, the version needs a bump"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "Download Natives"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: natives-*
          path: prebuilt-natives
          merge-multiple: true

      - name: "Build Jar"
        run: ./gradlew build verifyNatives -Pprebuilt_natives=prebuilt-natives

      - name: "Upload Jar"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nohorny-natives
          path: "build/libs/nohorny-natives.jar"
          archive: false
          if-no-files-found: error

      - name: "Publish to Maven"
        if: ${{ github.repository_owner == 'xpdustry' && (inputs.release || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
        run: ./gradlew publish -Pprebuilt_natives=prebuilt-natives
        env:
          ORG_GRADLE_PROJECT_xpdustryUsername: "${{ secrets.XPDUSTRY_MAVEN_USERNAME }}"
          ORG_GRADLE_PROJECT_xpdustryPassword: "${{ secrets.XPDUSTRY_MAVEN_PASSWORD }}"
          ORG_GRADLE_PROJECT_signingKey: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_signingPassword: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_PASSWORD }}"
