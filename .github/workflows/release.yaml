name: "Release"

on:
  workflow_dispatch:

# The called build workflow derives its group from the caller name, this one must differ or it cancels this run
concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    uses: ./.github/workflows/build.yaml
    with:
      release: true
    secrets: inherit
    permissions:
      contents: read

  release:
    name: "Release"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: "v${{ needs.build.outputs.version }}"
    steps:

      # The default branch may have moved since the build, its head is what gets bumped
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: "Setup Java 25"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Download Jar"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nohorny-natives.jar
          path: artifacts

      - name: "Create Release"
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            artifacts/nohorny-natives.jar

      - name: "Bump Version"
        id: bump
        run: |
          if [ "v$(java .github/scripts/Version.java get)" = "$TAG" ]; then
            echo "version=$(java .github/scripts/Version.java bump)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The version already moved past $TAG, nothing to bump"
          fi

      # The default branch only takes pull requests, so the bump goes through one
      - name: "Create Bump Branch"
        if: ${{ steps.bump.outputs.version != '' }}
        id: branch
        env:
          BRANCH: release/bump-${{ steps.bump.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$(git rev-parse HEAD)" --silent
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: "Commit Version Bump"
        if: ${{ steps.bump.outputs.version != '' }}
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Bot pull requests wait for an approval to run CI, which expires once merged, and the bump has nothing to check
          commit_message: "chore(release): Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          repo: ${{ github.repository }}
          branch: ${{ steps.branch.outputs.branch }}
          file_pattern: "gradle/libs.versions.toml README.md"

      - name: "Merge Version Bump"
        if: ${{ steps.bump.outputs.version != '' }}
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore(release): Bump version to $VERSION" \
            --body "Bumps the version after the release of $TAG."
          gh pr merge "$BRANCH" --squash --delete-branch
